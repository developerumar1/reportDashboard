version: "3.9"

services:
  backend:
    build: ./backend
    container_name: test-report-dashboard-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
  frontend:
    build: ./frontend
    container_name: test-report-dashboard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
